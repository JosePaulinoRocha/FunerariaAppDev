<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ segmento.nombre }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="modal-container">
    <div class="table-title">Categorias</div>

    <!-- Tarjetas por categoría -->
    <ion-card *ngFor="let categoria of egresosUnificados" class="categoria-card" (click)="openSubcategoryModal(categoria)">

      <ion-grid>

        <!-- Nombre de la categoría -->
        <ion-row>
          <ion-col size="12" class="categoria-nombre">
            <ion-label>{{ categoria.NombreCategoria }}</ion-label>
          </ion-col>
        </ion-row>

        <!-- Montos de Egresos (Cada uno en una fila) -->
        <ion-row class="categoria-detalles">
          <ion-col size="12">
            <ion-label class="concepto">Actual</ion-label>
            <ion-text color="primary" class="valor">
              $ {{ categoria.MontoActual | number:'1.2-2' }}
            </ion-text>
          </ion-col>
        </ion-row>
        <ion-row class="categoria-detalles">
          <ion-col size="12">
            <ion-label class="concepto">Planeado</ion-label>
            <ion-text color="success" class="valor">
              $ {{ categoria.MontoPlaneado | number:'1.2-2' }}
            </ion-text>
          </ion-col>
        </ion-row>
        <ion-row class="categoria-detalles">
          <ion-col size="12">
            <ion-label class="concepto">Desfase</ion-label>
            <ion-text [color]="categoria.MontoActual > categoria.MontoPlaneado ? 'danger' : 'tertiary'" class="valor">
              $ {{ (categoria.MontoPlaneado - categoria.MontoActual) | number:'1.2-2' }}
            </ion-text>
          </ion-col>
        </ion-row>

      </ion-grid>
    </ion-card>
  </div>
</ion-content>
