<ion-header>
  <ion-toolbar>
    <ion-title>Seleccionar segmento</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="modalController.dismiss()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar [(ngModel)]="searchTerm" (ionInput)="filterSegmentos()"></ion-searchbar>

  <ion-list *ngIf="filteredSegmentos.length > 0">
    <ion-item *ngFor="let segmento of filteredSegmentos" (click)="selectSegmento(segmento)">
      <ion-label>
        <h2>{{ segmento.NombreSegmento }}</h2>
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="filteredSegmentos.length === 0" class="no-results">
    <p>No hay segmentos disponibles.</p>
  </div>
</ion-content>
