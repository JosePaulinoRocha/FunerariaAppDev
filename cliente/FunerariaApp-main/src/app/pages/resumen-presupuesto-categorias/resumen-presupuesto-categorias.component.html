<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Categorías</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="modal-container">
    <div class="table-title">Categorías Unificadas</div>

    <ion-card *ngFor="let categoria of categorias" class="categoria-card" (click)="openSubcategoryModal(categoria)">
      <ion-card-title>{{ categoria.NombreCategoria }}</ion-card-title>
      
      <div class="categoria-detalles">
        <div class="detalle-row">
          <div class="detalle-label">Actual:</div>
          <div class="detalle-valor">${{ categoria.Actual | number }}</div>
        </div>

        <div class="detalle-row">
          <div class="detalle-label">Planeado:</div>
          <div class="detalle-valor">${{ categoria.Planeado | number }}</div>
        </div>

        <div class="desfase" 
          [ngClass]="{
            'negativo': calcularDesfase(categoria.Actual, categoria.Planeado) >= 0,
            'positivo': calcularDesfase(categoria.Actual, categoria.Planeado) < 0
          }">
          Desfase: {{ calcularDesfase(categoria.Planeado, categoria.Actual) | number:'1.0-2' }}
        </div>
      </div>
    </ion-card>
  </div>
</ion-content>
