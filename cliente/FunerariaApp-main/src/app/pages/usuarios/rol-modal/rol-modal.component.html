<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ isEditMode ? 'Modificar Rol' : 'Añadir Rol' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (ngSubmit)="saveRol()">
    <ion-list>
      <ion-item style="margin-top: 16px;">
        <ion-label position="stacked">ID</ion-label>
        <ion-input [(ngModel)]="rol.RolID" name="RolID" disabled></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Nombre del Rol</ion-label>
        <ion-input [(ngModel)]="rol.NombreRol" name="NombreRol" required></ion-input>
      </ion-item>
    </ion-list>

    <ion-list *ngIf="isEditMode">
      <ion-list-header>
        <ion-label>Permisos</ion-label>
      </ion-list-header>
      <ion-item *ngFor="let permiso of permisos">
        <ion-label>{{ permiso.NombrePermiso }}</ion-label>
        <ion-checkbox
          slot="end"
          [checked]="hasPermiso(permiso.PermisoID)"
          (ionChange)="togglePermiso(permiso.PermisoID, $event.detail.checked)">
        </ion-checkbox>
      </ion-item>
    </ion-list>

    <ion-footer>
      <ion-button expand="full" type="submit">
        {{ isEditMode ? 'Modificar Rol' : 'Añadir Rol' }}
      </ion-button>
    </ion-footer>
  </form>
</ion-content>
