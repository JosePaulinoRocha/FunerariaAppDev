<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Perido en el que se vence</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal(false)">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (ngSubmit)="GuardarGastoFrecuencia()" class="ion-padding">
    <ion-grid>
      <ion-row>
        <ion-col size-md="12">

          <ion-item style="width: 34rem;">
            <ion-label position="stacked">Periodos congelados</ion-label>
            <ion-select placeholder="Selecciona un periodo congelado" [(ngModel)]="gastoMensualFrecuencia.PeriodoID" name="periodoID" required >
              <ion-select-option *ngFor="let periodo of periodosCongelados" [value]="periodo.PeriodoID">
                {{ formatFechaAmigable(periodo.FechaInicio, periodo.FechaFin) }}
              </ion-select-option>
            </ion-select>
          </ion-item>

        </ion-col>
      </ion-row>
    </ion-grid>

    <ion-footer>
      <ion-button [disabled]="gastoMensualFrecuencia.PeriodoID == null" style="margin-bottom: 1rem;" expand="full" type="submit">Guardar</ion-button>
    </ion-footer>
  </form>
</ion-content>
