<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Asignar Cuenta</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (ngSubmit)="asignarCuenta()" class="ion-padding">
    <ion-grid>
      <ion-row>
        <ion-col size-md="12">

          <ion-item>
            <ion-label position="stacked">Tipo de Cuenta</ion-label>
            <ion-select 
              style="width: 32rem;" 
              [(ngModel)]="ingreso.TipoCuentaID" 
              name="tipoCuentaID" 
              required 
              interface="alert" 
              searchbar="true" 
              placeholder="Tipo cuenta"
              (ionChange)="onTipoCuentaChange()">
              <ion-select-option [value]="1">Caja Chica</ion-select-option>
              <ion-select-option [value]="2">Cuenta Bancaria</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item style="height: 5rem;" *ngIf="ingreso.TipoCuentaID">
            <ion-label position="stacked">Cuenta</ion-label>
            <ion-radio-group style="display: flex;" [(ngModel)]="isNewCuenta" name="isNewCuenta">
              <ion-item style="font-size: 12px;" *ngIf="ingreso.TipoCuentaID === 2 || ingreso.TipoCuentaID === 1">
                <ion-label>Usar existente</ion-label>
                <ion-radio slot="start" [value]="false" (ionSelect)="onCuentaSelection(false)"></ion-radio>
              </ion-item>
              <ion-item style="font-size: 12px;" *ngIf="ingreso.TipoCuentaID === 1 || ingreso.TipoCuentaID === 2">
                <ion-label>Crear nuevo</ion-label>
                <ion-radio slot="start" [value]="true" (ionSelect)="onCuentaSelection(true)"></ion-radio>
              </ion-item>
            </ion-radio-group>
          </ion-item>

          <ion-item *ngIf="!isNewCuenta && ingreso.TipoCuentaID === 1">
            <ion-label position="stacked">Caja Chica</ion-label>
            <ion-select placeholder="Caja Chica" style="width: 32rem;" [(ngModel)]="ingreso.CuentaID" name="cuenta" required interface="alert" searchbar="true">
              <ion-select-option *ngFor="let item of filteredCuentas" [value]="item.CuentaID" placeholder="Seleccione Caja Chica">{{ item.NombreCuenta }}</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item *ngIf="isNewCuenta && ingreso.TipoCuentaID === 1">
            <ion-label position="stacked">Nueva Caja Chica</ion-label>
            <ion-input style="width: 32rem;" [(ngModel)]="newNombreCuenta" name="newNombreCuenta" placeholder="Nuevo Caja Chica" required></ion-input>
          </ion-item>

          <ion-item *ngIf="!isNewCuenta && ingreso.TipoCuentaID === 2">
            <ion-label position="stacked">Cuenta Bancaria</ion-label>
            <ion-select placeholder="Cuenta Bancaria" style="width: 32rem;" [(ngModel)]="ingreso.CuentaID" name="cuenta" required interface="alert" searchbar="true" (ionChange)="onCuentaChange($event)">
              <ion-label position="stacked">Cuenta Cuenta Bancaria</ion-label>
              <ion-select-option style="width: 32rem;" *ngFor="let item of filteredCuentas" [value]="item.CuentaID" placeholder="Seleccione Cuenta Bancaria">{{ item.NombreCuenta }}</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item *ngIf="isNewCuenta && ingreso.TipoCuentaID === 2">
            <ion-label position="stacked">Nueva Cuenta Bancaria</ion-label>
            <ion-input style="width: 32rem;" [(ngModel)]="newNombreCuenta" name="newNombreCuenta" placeholder="Nueva Cuenta Bancaria" required></ion-input>
          </ion-item>
          
          <ion-item *ngIf="!isNewCuenta && ingreso.TipoCuentaID === 2">
            <ion-label position="stacked">RFC</ion-label>
            <ion-input placeholder="RFC" style="width: 32rem;" [(ngModel)]="ingreso.RFC" name="rfc" [readonly]="true"></ion-input>
          </ion-item>

          <ion-item *ngIf="isNewCuenta && ingreso.TipoCuentaID === 2">
            <ion-label position="stacked">RFC</ion-label>
            <ion-input style="width: 32rem;" [(ngModel)]="newRFC" name="newRFC" placeholder="Nuevo RFC" required></ion-input>
          </ion-item>

        </ion-col>
      </ion-row>
    </ion-grid>

    <ion-footer>
      <ion-button style="margin-bottom: 1rem;" expand="full" type="submit">Asignar Cuenta</ion-button>
    </ion-footer>
  </form>
</ion-content>
