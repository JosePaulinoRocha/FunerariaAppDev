<ion-header>
  <ion-toolbar>
    <ion-title>Seleccionar {{ tipoCuentaID === 1 ? 'Caja Chica' : 'Cuenta Bancaria' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar
    [(ngModel)]="searchTerm"
    (ionInput)="onSearchChange()"
    placeholder="Buscar cuenta"
  ></ion-searchbar>

  <ion-list>
    <ion-item
      button
      *ngFor="let cuenta of filteredCuentas"
      (click)="selectCuenta(cuenta)"
    >
      {{ cuenta.NombreCuenta }}
    </ion-item>
  </ion-list>
</ion-content>
